<!doctype html>
<!--
  KESTREL — the descent
  A seed-built roguelike horror. Every deck, room, anomaly, and SPECIES is
  generated from the run's seed — share ?seed=N and someone else boards the
  exact same ship and meets the exact same creatures (Library of Babel, but
  it's a haunted salvage hull). Textures and creature cutouts are painted onto
  <canvas> at load, creature voices are synthesized from the seed.
  Foley uses the repo's CC0 sample packs (audio/kenney, audio/guns), with
  full synth fallback if they're missing.

  Find the hatch. Go down. It gets worse.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KESTREL</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:"SF Mono",ui-monospace,Menlo,monospace}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 46%, rgba(0,0,0,.62) 100%)}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(160,10,5,.55) 100%)}
  .ui{position:fixed;pointer-events:none;color:#cfd6dd;text-shadow:0 1px 4px #000;
    letter-spacing:.14em;text-transform:uppercase}
  #hud{left:0;right:0;bottom:26px;text-align:center;font-size:11px;line-height:1.7;
    letter-spacing:.18em;transition:opacity .6s ease}
  #hud b{color:#ffb066;font-weight:600}
  #hud .sub{color:#7c858d;letter-spacing:.12em}
  #hud.hidden{opacity:0}
  #stat{left:24px;top:20px;font-size:11px;opacity:0;transition:opacity .4s;
    background:rgba(3,5,8,.62);padding:8px 12px 9px;border-left:2px solid #ffb066;line-height:1.8}
  #stat b{color:#ffb066}
  #stat .obj{color:#4be8ff;font-size:10px}
  #stat .dim{color:#767f88;font-size:9px}
  #bars{left:24px;bottom:22px;opacity:0;transition:opacity .4s}
  .bar{width:170px;height:8px;background:rgba(10,12,14,.7);border:1px solid #2a2e33;margin-top:5px}
  .bar i{display:block;height:100%;transition:width .2s}
  .bar.low i{animation:hplow .9s ease-in-out infinite}
  @keyframes hplow{50%{filter:brightness(2)}}
  #hpf{background:linear-gradient(90deg,#a83226,#d4543a);width:100%}
  #batf{background:linear-gradient(90deg,#1e7a8a,#4be8ff);width:100%}
  .blab{font-size:8px;color:#5a626a;margin-top:6px}
  #wpn{right:26px;bottom:22px;text-align:right;font-size:12px;line-height:1.5;opacity:0;transition:opacity .4s}
  #wpn.on,#stat.on,#bars.on{opacity:1}
  #wname{color:#ffb066;font-weight:600}
  #ammo{font-size:22px;color:#e8eef4}
  #ammo span{font-size:12px;color:#7c858d}
  #slots{margin-top:6px;font-size:9px;color:#5a626a;letter-spacing:.1em;max-width:270px;
    display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
  #slots span,#slots b{display:inline-block;padding:1px 5px;border:1px solid #23272c;
    background:rgba(8,10,13,.6)}
  #slots b{color:#0b0c0e;font-weight:600;background:#ffb066;border-color:#ffb066}
  #prompt{left:0;right:0;bottom:110px;text-align:center;font-size:12px;color:#dfe7ee;opacity:0;transition:opacity .15s}
  #prompt b{color:#4be8ff}
  #toasts{left:0;right:0;top:64px;text-align:center;font-size:11px}
  .toast{margin:4px auto;color:#c9a06a;opacity:0;transition:opacity .4s}
  .toast.on{opacity:1}
  #xh{left:50%;top:50%;opacity:0;transition:opacity .3s}
  #xh.on{opacity:1}
  #xh i{position:absolute;background:#dfe7ee;box-shadow:0 0 3px #000}
  #xh.hit i{background:#ff7a50}
  #xh .t{width:1.5px;height:7px;left:-.75px;top:calc(-7px - var(--g,6px))}
  #xh .b{width:1.5px;height:7px;left:-.75px;top:var(--g,6px)}
  #xh .l{width:7px;height:1.5px;top:-.75px;left:calc(-7px - var(--g,6px))}
  #xh .r{width:7px;height:1.5px;top:-.75px;left:var(--g,6px)}
  #xh .c{width:2px;height:2px;left:-1px;top:-1px;border-radius:1px}
  .cover{cursor:pointer}
  .cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:#000;color:#cfd6dd;
    text-transform:uppercase;letter-spacing:.3em;transition:opacity 1.2s ease;z-index:5}
  .cover h1{font-size:34px;font-weight:600;color:#ffb066;margin:0 0 14px;letter-spacing:.5em}
  .cover .sub{font-size:11px;color:#7c858d;line-height:2}
  .cover .red{color:#c4513a}
  .cover.gone{opacity:0;pointer-events:none}
  #card{background:rgba(2,3,5,.8);text-shadow:0 2px 12px #000,0 0 4px #000}
  #death{display:none}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
  <script type="module" crossorigin src="./assets/kestrel-C91UsxYF.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/three-BROBeMa5.js">
</head>
<body>
<div id="vignette"></div>
<div id="dmg"></div>
<div id="hud" class="ui"><b>KESTREL</b> · it is quiet on this deck<br>
<span class="sub">click to wake · wasd · space jump · shift run · f torch · e search · 1-8 arms · r reload</span></div>
<div id="stat" class="ui"></div>
<div id="bars" class="ui"><div class="blab">VITALS <span id="hpn"></span></div><div class="bar" id="hpbar"><i id="hpf"></i></div>
<div class="blab">TORCH</div><div class="bar"><i id="batf"></i></div></div>
<div id="wpn" class="ui"><div id="wname"></div><div id="ammo"></div><div id="slots"></div></div>
<div id="prompt" class="ui"></div>
<div id="toasts" class="ui"></div>
<div id="xh" class="ui"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="c"></i></div>
<div id="card" class="cover gone"></div>
<div id="death" class="cover"></div>
</body>
</html>
