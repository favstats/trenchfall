<!-- Importmap: lets CDN-fetched three addons resolve their bare `three` import
     to the same pinned WebGPU build our modules use. Local modules import via
     full CDN URL through winterfell/engine/three.js to avoid vite rewriting. -->
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
  "three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
  "three/tsl":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">

</div>

</body>
